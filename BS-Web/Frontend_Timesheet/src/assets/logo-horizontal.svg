<svg width="120" height="40" viewBox="0 0 120 40" fill="none"
    xmlns="http://www.w3.org/2000/svg">
    <!-- Clock Icon -->
    <circle cx="20" cy="20" r="18" fill="url(#logoGradient)" stroke="url(#logoStroke)" stroke-width="1"/>
    <circle cx="20" cy="20" r="14" fill="white" fill-opacity="0.9"/>
    <circle cx="20" cy="20" r="14" stroke="url(#clockBorder)" stroke-width="1" fill="none"/>

    <!-- Clock Hands -->
    <g stroke-linecap="round">
        <line x1="20" y1="20" x2="20" y2="12" stroke="#1E40AF" stroke-width="2"/>
        <line x1="20" y1="20" x2="26" y2="20" stroke="#3B82F6" stroke-width="1.5"/>
    </g>
    <circle cx="20" cy="20" r="1.5" fill="#1E40AF"/>

    <!-- Hour Markers -->
    <g stroke="#4F46E5" stroke-width="1" stroke-linecap="round">
        <line x1="20" y1="8" x2="20" y2="9.5"/>
        <line x1="32" y1="20" x2="30.5" y2="20"/>
        <line x1="20" y1="32" x2="20" y2="30.5"/>
        <line x1="8" y1="20" x2="9.5" y2="20"/>
    </g>

    <!-- Text -->
    <text x="45" y="16" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#1F2937">
    Timesheet
    </text>
    <text x="45" y="28" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="400" fill="#6B7280">
    SYSTEM
    </text>

    <!-- Gradients -->
    <defs>
        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
        </linearGradient>

        <linearGradient id="logoStroke" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
        </linearGradient>

        <linearGradient id="clockBorder" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:0.6" />
            <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:0.6" />
        </linearGradient>
    </defs>
</svg>
