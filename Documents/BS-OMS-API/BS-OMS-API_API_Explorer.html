<title>BS-OMS-API Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F4F6FA; --surface:#FFFFFF; --surface-2:#EEF2F8; --line:#D9E0EA; --line-strong:#C3CDDB;
  --ink:#1B2A41; --ink-2:#44546B; --muted:#6A7890;
  --accent:#0E6BA8; --accent-soft:#E1EEF8;
  --get:#1F7A4D; --get-soft:#E3F3EA; --post:#2B59C3; --post-soft:#E5ECFB;
  --warn:#9A6212; --warn-soft:#FCF1DF; --crit:#B3261E; --crit-soft:#FBE7E5;
  --code-bg:#0F1B2D; --code-ink:#D8E2F0; --code-key:#7FB8F0; --code-str:#9FD8A8; --code-num:#F2C27B; --code-lit:#E59BD4; --code-mute:#7D8BA3;
  --sans:"IBM Plex Sans Thai","Leelawadee UI","Tahoma",system-ui,sans-serif;
  --mono:"IBM Plex Mono","Consolas","Menlo",monospace;
  --radius:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0E1520; --surface:#151F2D; --surface-2:#1B2738; --line:#26344A; --line-strong:#33445E;
    --ink:#E6ECF5; --ink-2:#B4C0D2; --muted:#8392A9;
    --accent:#5FA8E0; --accent-soft:#16304A;
    --get:#5CC98E; --get-soft:#14301F; --post:#7FA2F5; --post-soft:#1A2748;
    --warn:#E8B45E; --warn-soft:#33260F; --crit:#F08A80; --crit-soft:#3A1A18;
    --code-bg:#0A111B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E1520; --surface:#151F2D; --surface-2:#1B2738; --line:#26344A; --line-strong:#33445E;
  --ink:#E6ECF5; --ink-2:#B4C0D2; --muted:#8392A9;
  --accent:#5FA8E0; --accent-soft:#16304A;
  --get:#5CC98E; --get-soft:#14301F; --post:#7FA2F5; --post-soft:#1A2748;
  --warn:#E8B45E; --warn-soft:#33260F; --crit:#F08A80; --crit-soft:#3A1A18;
  --code-bg:#0A111B;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;margin:0}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:.88em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:320px minmax(0,1fr);height:100%}
.side{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand h1{font-size:18px;line-height:1.2;margin:0;letter-spacing:.01em}
.brand h1 span{color:var(--accent)}
.brand p{margin:4px 0 0;color:var(--muted);font-size:12.5px}
.filters{padding:12px 18px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.search{width:100%;padding:8px 11px;border:1px solid var(--line-strong);border-radius:6px;background:var(--ground);color:var(--ink);font:inherit;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:transparent;color:var(--ink-2);border-radius:999px;padding:2px 11px;font:500 12px/1.8 var(--mono);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.nav{overflow:auto;padding:6px 0 24px;flex:1;min-height:0}
.group-title{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:14px 18px 4px;display:flex;justify-content:space-between}
.item{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:start;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:6px 18px;cursor:pointer;font:inherit;border-left:3px solid transparent}
.item:hover{background:var(--surface-2)}
.item[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.item .p{font-family:var(--mono);font-size:12px;line-height:1.45;word-break:break-all;color:var(--ink-2)}
.item .s{display:block;font-family:var(--sans);font-size:12.5px;color:var(--ink);word-break:normal;margin-top:1px}
.m{display:inline-block;font:600 10.5px/1 var(--mono);letter-spacing:.04em;padding:4px 0;border-radius:4px;text-align:center;width:44px}
.m.GET{background:var(--get-soft);color:var(--get)}
.m.POST{background:var(--post-soft);color:var(--post)}
.m.REF{background:var(--surface-2);color:var(--muted)}
.empty{padding:16px 18px;color:var(--muted);font-size:13px}

.main{overflow:auto;min-height:0}
.wrap{max-width:980px;margin:0 auto;padding-inline:32px;padding-block:28px 64px}
.topbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:24px}
.topbar label{display:grid;gap:3px;font-size:11.5px;color:var(--muted);font-weight:500;flex:1 1 220px}
.topbar input{padding:6px 9px;border:1px solid var(--line-strong);border-radius:5px;background:var(--ground);color:var(--ink);font:13px var(--mono)}
.topbar .hint{flex:1 1 100%;font-size:12px;color:var(--muted);margin:0}

.crumb{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.ep-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 4px}
.ep-head .m{width:auto;padding:6px 10px;font-size:13px}
.ep-path{font:600 clamp(16px,2.2vw,21px)/1.35 var(--mono);word-break:break-all;margin:0}
.ep-summary{font-size:19px;font-weight:600;margin:10px 0 6px;text-wrap:balance}
.ep-desc{color:var(--ink-2);margin:0 0 14px;max-width:70ch}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.badge{font-size:12px;border-radius:999px;padding:2px 10px;border:1px solid var(--line-strong);color:var(--ink-2);background:var(--surface)}
.badge.ok{border-color:transparent;background:var(--get-soft);color:var(--get)}
.badge.warn{border-color:transparent;background:var(--warn-soft);color:var(--warn)}
.badge.info{border-color:transparent;background:var(--accent-soft);color:var(--accent)}

section.block{margin-top:26px}
section.block>h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600;display:flex;align-items:center;gap:10px}
section.block>h3::after{content:"";flex:1;height:1px;background:var(--line)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--mono);font-size:12.5px;white-space:nowrap;color:var(--ink)}
td.t{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.req{font-size:11px;font-weight:600;border-radius:4px;padding:1px 7px;white-space:nowrap}
.req.y{background:var(--crit-soft);color:var(--crit)}
.req.n{background:var(--surface-2);color:var(--muted)}
.req.c{background:var(--warn-soft);color:var(--warn)}
.in{font:500 11px var(--mono);color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 6px}
td code{color:var(--ink);background:var(--surface-2);padding:0 4px;border-radius:3px}
.code-status{font:600 12.5px var(--mono);border-radius:4px;padding:1px 7px}
.s2{background:var(--get-soft);color:var(--get)} .s3{background:var(--accent-soft);color:var(--accent)} .s4{background:var(--warn-soft);color:var(--warn)} .s5{background:var(--crit-soft);color:var(--crit)}

.codebox{background:var(--code-bg);border-radius:var(--radius);position:relative;overflow:hidden}
.codebox .bar{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;border-bottom:1px solid rgba(255,255,255,.07);font:500 11.5px var(--mono);color:var(--code-mute)}
.copy{border:1px solid rgba(255,255,255,.16);background:transparent;color:var(--code-ink);border-radius:5px;font:500 11.5px var(--mono);padding:3px 10px;cursor:pointer}
.copy:hover{background:rgba(255,255,255,.08)}
pre{margin:0;padding:14px 16px;overflow-x:auto;color:var(--code-ink);font:13px/1.6 var(--mono);tab-size:2}
.k{color:var(--code-key)} .st{color:var(--code-str)} .nu{color:var(--code-num)} .li{color:var(--code-lit)} .cm{color:var(--code-mute)}
.tabs{display:flex;gap:2px}
.tab{background:transparent;border:0;color:var(--code-mute);font:500 11.5px var(--mono);padding:3px 10px;border-radius:5px;cursor:pointer}
.tab[aria-selected="true"]{background:rgba(255,255,255,.1);color:var(--code-ink)}

.callout{border-radius:var(--radius);padding:10px 14px;font-size:13.5px;margin-top:10px;border:1px solid transparent}
.callout.warn{background:var(--warn-soft);color:var(--ink);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.callout.info{background:var(--accent-soft);color:var(--ink);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.callout b{color:inherit}
.note{color:var(--muted);font-size:12.5px;margin:8px 0 0}
.fields{margin:0;padding-left:18px;color:var(--ink-2);font-size:13.5px}
.fields li{margin:2px 0}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;border-top:1px solid var(--line);padding-top:16px;flex-wrap:wrap}
.pager button{background:transparent;border:1px solid var(--line-strong);border-radius:6px;padding:8px 12px;cursor:pointer;color:var(--ink);font:inherit;font-size:13px;text-align:left;max-width:48%}
.pager button small{display:block;color:var(--muted);font-size:11px}
.menu-btn{display:none}

@media (max-width:860px){
  .app{grid-template-columns:1fr;height:auto}
  html,body{height:auto}
  .side{border-right:0;border-bottom:1px solid var(--line);max-height:none}
  .nav{max-height:46vh}
  .side.collapsed .nav,.side.collapsed .filters{display:none}
  .menu-btn{display:inline-block;margin-top:10px;border:1px solid var(--line-strong);background:var(--ground);color:var(--ink);border-radius:6px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
  .wrap{padding-inline:16px;padding-block:20px 48px}
  .pager button{max-width:100%;flex:1 1 100%}
}
@media (prefers-reduced-motion:no-preference){ .item,.chip,.copy{transition:background-color .12s ease,color .12s ease} }
</style>

<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <h1>BS-OMS-API <span>Explorer</span></h1>
      <p>API v1 · 35 endpoints · Shopee / Lazada / TikTok</p>
      <button class="menu-btn" id="menuBtn" aria-expanded="true" aria-controls="nav">ซ่อนรายการ API</button>
    </div>
    <div class="filters">
      <input class="search" id="q" type="search" placeholder="ค้นหา path หรือชื่อ API…" aria-label="ค้นหา endpoint">
      <div class="chips" role="group" aria-label="กรองตาม method">
        <button class="chip" id="f-all" data-m="ALL" aria-pressed="true">ALL</button>
        <button class="chip" id="f-get" data-m="GET" aria-pressed="false">GET</button>
        <button class="chip" id="f-post" data-m="POST" aria-pressed="false">POST</button>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="รายการ endpoint"></nav>
  </aside>

  <main class="main" id="main">
    <div class="wrap">
      <div class="topbar">
        <label for="baseUrl">Base URL
          <input id="baseUrl" value="https://localhost:53954" spellcheck="false">
        </label>
        <label for="apiKey">X-Api-Key
          <input id="apiKey" value="<your-api-key>" spellcheck="false">
        </label>
        <p class="hint">ค่าที่ใส่ใช้สร้างคำสั่ง curl ในแต่ละ endpoint เท่านั้น หน้านี้ไม่ได้ส่ง request จริง ค่าใน JSON ทั้งหมดเป็นตัวอย่าง</p>
      </div>
      <article id="detail" aria-live="polite"></article>
    </div>
  </main>
</div>

<script>
// ───────────────────────── Data ─────────────────────────
const P = (name, inn, type, req, desc) => ({ name, in: inn, type, req, desc });
const F = (name, type, req, desc) => ({ name, type, req, desc });
const J = (o) => JSON.stringify(o, null, 2);
const ok = (data, message = "Success", totalCount) => {
  const r = { success: true, message, data };
  if (totalCount !== undefined) r.totalCount = totalCount;
  return J(r);
};
const PLAT = P("platform", "path", "string", "y", "<code>shopee</code>, <code>lazada</code>, <code>tiktok</code> (ไม่สนตัวพิมพ์)");
const PLAT_ENUM = P("platform", "path", "PlatformType", "y", "<code>Shopee</code>, <code>Lazada</code>, <code>TikTok</code> หรือ 0–2");
const TOKEN_Q = P("accessToken", "query", "string", "y", "Token ของ Marketplace");
const SHOP_Q = P("shopId", "query", "string", "n", "Shop ID ของร้าน");
const SHOP_QR = P("shopId", "query", "string", "y", "Shop ID ของร้าน");

const sampleOrder = {
  orderId: "240924ABCDEF", platform: 0, status: 2, originalStatus: "READY_TO_SHIP",
  buyerName: "somchai_s", buyerRemarks: "", taxInvoiceRequested: false, taxInvoice: null,
  cancellationDeadline: "2026-09-26T10:00:00Z", daysUntilCancellation: 2,

  totalAmount: 1290.00, currency: "THB",
  shipping: { carrier: "Shopee Xpress", trackingNumber: "", packageNumber: "OFG123", shippingMethod: "dropoff", shippingFee: 38.00, estimatedDeliveryDate: null,
    recipientAddress: { name: "สมชาย ใจดี", phone: "0812345678", addressLine1: "99/1 ถ.สุขุมวิท", addressLine2: "", subDistrict: "คลองเตย", district: "คลองเตย", province: "กรุงเทพมหานคร", postalCode: "10110", country: "TH", fullAddress: "99/1 ถ.สุขุมวิท คลองเตย กรุงเทพมหานคร 10110" } },
  packages: [],
  items: [{ itemId: "100200300", modelId: 555, orderItemId: 0, promotionGroupId: 0, sku: "SKU-001", name: "เสื้อยืด Cotton", quantity: 2, unitPrice: 645.00, totalPrice: 1290.00, discount: 0, imageUrl: "", variation: "สีขาว, L", weight: 0.3 }],
  shopName: "OGA Official Store"
};
const sampleProduct = {
  itemId: "100200300", platform: 1, name: "เสื้อยืด Cotton", sku: "SKU-001", status: "active", imageUrl: "",
  price: 645.00, currency: "THB", stock: { currentStock: 42, reservedStock: 2, availableStock: 40 },

  totalStock: 42, createdAt: "2026-05-01T00:00:00Z", updatedAt: "2026-09-20T08:00:00Z"
};
const sampleToken = { platform: 0, accessToken: "<access-token>", refreshToken: "<refresh-token>", expiresAt: "2026-09-24T08:00:00Z", refreshExpiresAt: "2026-10-24T04:00:00Z", shopId: "123456", shopName: "OGA Official Store" };
const samplePkgRecord = { platformPackageRecordId: 101, wmsPackageRef: "3f1c9a2e-0b7d-4c1e-9f11-2a6b5c7d8e90", boxNumber: 1, platformPackageId: "OFG123", trackingNumber: "TH0123456789", shippingProviderId: "18025", shippingProviderName: "Shopee Xpress", packageStatus: "READY", syncStatus: "SYNCED", error: null };
const sampleDoc = { platformDocumentId: 55, platform: 0, shopId: "123456", platformOrderId: "240924ABCDEF", platformPackageId: "OFG123", trackingNumber: "TH0123456789", documentType: "NORMAL_AIR_WAYBILL", documentStatus: "READY", fileName: "240924ABCDEF-OFG123.pdf", contentType: "application/pdf", fileSize: 48213, error: null };

const E = [
  // ─── Auth ───
  { id: "auth-authorize", group: "Auth", method: "GET", path: "/api/auth/{platform}/authorize", summary: "Redirect ไปหน้า OAuth",
    desc: "เปิดจาก browser เพื่อเริ่มเชื่อมร้าน ระบบ redirect (302) ไปหน้าอนุญาตสิทธิ์ของ Marketplace", auth: "none",
    params: [PLAT], responseType: "redirect",
    response: "HTTP/1.1 302 Found\nLocation: https://partner.shopeemobile.com/api/v2/shop/auth_partner?partner_id=...&redirect=...&sign=...",
    statuses: [[302, "Redirect ไปหน้า OAuth"], [400, "platform ไม่รองรับ"]] },
  { id: "auth-url", group: "Auth", method: "GET", path: "/api/auth/{platform}/auth-url", summary: "ขอ URL OAuth",
    desc: "คืน URL ของหน้า OAuth โดยไม่ redirect เหมาะกับหน้าเว็บที่ต้องการเปิด URL เอง", auth: "none",
    params: [PLAT], response: ok({ url: "https://partner.shopeemobile.com/api/v2/shop/auth_partner?partner_id=...&sign=..." }),
    statuses: [[200, "สำเร็จ"], [400, "platform ไม่รองรับ"]] },
  { id: "auth-callback", group: "Auth", method: "GET", path: "/api/auth/{platform}/callback", summary: "OAuth Callback",
    desc: "Marketplace เรียกกลับมาหลังผู้ใช้อนุญาตสิทธิ์ OMS แลก code เป็น token แล้วบันทึกแบบเข้ารหัสในตาราง oms.t_oms_platform_credential", auth: "none",
    params: [PLAT, P("code", "query", "string", "y", "Authorization code จาก Marketplace"), P("shop_id", "query", "string", "n", "Shop ID (Shopee ส่งมา)")],
    response: ok(sampleToken, "Authorization successful"),
    statuses: [[200, "บันทึก token สำเร็จ"], [400, "แลก code ไม่สำเร็จ (message = OAuth error: ...)"]] },
  { id: "auth-refresh", group: "Auth", method: "POST", path: "/api/auth/{platform}/refresh", summary: "Refresh Token",
    desc: "ขอ access token ใหม่ด้วย refresh token", params: [PLAT],
    bodyFields: [F("refreshToken", "string", "y", "Refresh token (ไม่เกิน 512 ตัวอักษร)"), F("shopId", "string", "n", "Shop ID")],
    body: J({ refreshToken: "<refresh-token>", shopId: "123456" }),
    response: ok(sampleToken, "Token refreshed successfully"),
    statuses: [[200, "สำเร็จ"], [400, "refresh ไม่สำเร็จ (message = Refresh error: ...)"]] },
  { id: "auth-sandbox", group: "Auth", method: "POST", path: "/api/auth/sandbox-token", summary: "Import Sandbox Token",
    desc: "บันทึก token ที่สร้างจากเครื่องมือ Sandbox ของ Marketplace แบบเข้ารหัส",
    warn: "ใช้ได้เฉพาะ environment Development หรือ Staging หรือเมื่อตั้ง <code>OMS_ENABLE_SANDBOX_TOKEN_IMPORT=YES</code> มิฉะนั้นคืน 404",
    bodyFields: [F("platform", "string", "y", "<code>shopee</code>, <code>lazada</code>, <code>tiktok</code>"), F("accessToken", "string", "y", "ไม่เกิน 2,048 ตัวอักษร"), F("refreshToken", "string", "n", "ไม่เกิน 2,048 ตัวอักษร"), F("shopId", "string", "y", "ไม่เกิน 128 ตัวอักษร"), F("shopName", "string", "n", "ไม่เกิน 256 ตัวอักษร"), F("expiresInSeconds", "int", "n", "60 – 2,592,000"), F("refreshExpiresInSeconds", "int", "n", "60 – 7,776,000")],
    body: J({ platform: "shopee", accessToken: "<token>", refreshToken: "<token>", shopId: "123456", shopName: "Test Shop", expiresInSeconds: 14400, refreshExpiresInSeconds: 2592000 }),
    response: ok({ platform: "Shopee", shopId: "123456", environment: "SANDBOX", expiresAt: "2026-09-24T08:00:00Z", refreshTokenSaved: true }, "Shopee Sandbox credential encrypted and saved"),
    statuses: [[200, "บันทึกสำเร็จ"], [400, "ข้อมูลไม่ถูกต้อง"], [404, "ปิดใช้งานใน environment นี้"]] },

  // ─── Order ───

// ───────────────────────── Rendering helpers ─────────────────────────
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function hl(src) {
  const s = esc(src);
  if (!/^\s*[\[{]/.test(src)) return s.replace(/^(HTTP\/1\.1 .*)$/m, '<span class="k">$1</span>').replace(/^([A-Za-z-]+):/gm, '<span class="cm">$1:</span>');
  const re = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|(-?\b\d+(?:\.\d+)?\b)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    if (m[1]) out += m[2] ? `<span class="k">${esc(m[1])}</span>${m[2]}` : `<span class="st">${esc(m[1])}</span>`;
    else if (m[3]) out += `<span class="li">${m[3]}</span>`;
    else out += `<span class="nu">${m[4]}</span>`;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
const reqBadge = (r) => r === "y" ? '<span class="req y">จำเป็น</span>' : r === "c" ? '<span class="req c">บางกรณี</span>' : '<span class="req n">ไม่บังคับ</span>';
const statusCls = (c) => "s" + String(c)[0];
let copySeq = 0;
function codeBox(label, src, tabs) {
  const id = "cb" + (copySeq++);
  return `<div class="codebox"><div class="bar"><span>${label}</span>${tabs || ""}<button class="copy" data-copy="${id}">คัดลอก</button></div><pre id="${id}">${hl(src)}</pre></div>`;
}
function table(head, rows) {
  return `<div class="tbl-wrap"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
}
function curlFor(ep) {
  const base = ($("#baseUrl").value || "").replace(/\/+$/, "");
  const key = $("#apiKey").value || "<your-api-key>";
  let path = ep.path;
  const query = (ep.params || []).filter(p => p.in === "query").map(p => `${p.name}=${p.name === "platform" ? "Shopee" : "<" + p.name + ">"}`);
  path = path.replace("{platform}", "shopee");
  const url = base + path + (query.length ? "?" + query.join("&") : "");
  const lines = [`curl -X ${ep.method} "${url}"`];
  if (ep.auth !== "none") lines.push(`  -H "X-Api-Key: ${key}"`);
  if (ep.body) { lines.push(`  -H "Content-Type: application/json"`); lines.push(`  -d '${JSON.stringify(JSON.parse(ep.body))}'`); }
  if (ep.responseType === "file") lines.push(`  -o output.pdf`);
  return lines.join(" \\\n");
}

function renderEndpoint(ep) {
  const badges = [];
  badges.push(ep.auth === "none" ? '<span class="badge warn">ไม่ต้องใช้ X-Api-Key</span>' : '<span class="badge ok">ต้องใช้ X-Api-Key</span>');
  if (ep.token === "stored") badges.push('<span class="badge info">ใช้ token ที่ OMS เก็บไว้</span>');
  if (ep.token === "request") badges.push('<span class="badge">ต้องส่ง accessToken ของ Marketplace</span>');
  if (ep.responseType === "file") badges.push('<span class="badge">คืนไฟล์ PDF</span>');

  let html = `<div class="crumb">${esc(ep.group)}</div>
    <div class="ep-head"><span class="m ${ep.method}">${ep.method}</span><h2 class="ep-path">${esc(ep.path)}</h2></div>
    <div class="ep-summary">${esc(ep.summary)}</div>
    <p class="ep-desc">${esc(ep.desc)}</p>
    <div class="badges">${badges.join("")}</div>`;
  if (ep.warn) html += `<div class="callout warn"><b>ข้อควรรู้:</b> ${ep.warn}</div>`;
  if (ep.info) html += `<div class="callout info"><b>หมายเหตุ:</b> ${ep.info}</div>`;
  if (ep.flow) html += `<section class="block"><h3>ลำดับการทำงาน</h3><ol class="fields">${ep.flow.map(s => `<li>${esc(s)}</li>`).join("")}</ol></section>`;

  if (ep.params && ep.params.length) {
    html += `<section class="block"><h3>Parameters</h3>${table(["ชื่อ", "In", "Type", "", "คำอธิบาย"],
      ep.params.map(p => `<tr><td class="n">${p.name}</td><td><span class="in">${p.in}</span></td><td class="t">${p.type}</td><td>${reqBadge(p.req)}</td><td>${p.desc}</td></tr>`))}</section>`;
  }
  if (ep.bodyFields) {
    html += `<section class="block"><h3>Request Body · application/json</h3>${table(["Field", "Type", "", "คำอธิบาย"],
      ep.bodyFields.map(f => `<tr><td class="n">${f.name}</td><td class="t">${f.type}</td><td>${reqBadge(f.req)}</td><td>${f.desc}</td></tr>`))}
      <div style="margin-top:12px">${codeBox("ตัวอย่าง Request", ep.body)}</div></section>`;
  }
  html += `<section class="block"><h3>Response</h3>${codeBox(ep.responseType === "file" ? "ตัวอย่าง Response (ไฟล์)" : ep.responseType === "redirect" ? "ตัวอย่าง Response (redirect)" : "ตัวอย่าง Response · 200", ep.response)}
    ${ep.responseType ? "" : '<p class="note">รูปแบบ ApiResponse&lt;T&gt;: success, message, data, totalCount · enum ใน JSON เป็นตัวเลข</p>'}</section>`;
  html += `<section class="block"><h3>Status Codes</h3>${table(["Code", "ความหมาย"],
    [...ep.statuses, ...(ep.auth === "none" ? [] : [[401, "API Key ไม่ถูกหรือไม่มี"]])].map(([c, t]) => `<tr><td><span class="code-status ${statusCls(c)}">${c}</span></td><td>${esc(t)}</td></tr>`))}</section>`;
  html += `<section class="block"><h3>ตัวอย่างคำสั่ง</h3>${codeBox("curl", curlFor(ep))}</section>`;
  return html;
}

// ───────────────────────── Nav & state ─────────────────────────
let current = null, methodFilter = "ALL";
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

function visible() {
  const q = $("#q").value.trim().toLowerCase();
  return ALL.filter(e => (methodFilter === "ALL" || e.method === methodFilter || (e.method === "REF" && methodFilter === "ALL")) &&
    (!q || (e.path + " " + e.summary + " " + e.group).toLowerCase().includes(q)));
}
function renderNav() {
  const list = visible();
  const groups = [];
  list.forEach(e => { let g = groups.find(x => x.name === e.group); if (!g) groups.push(g = { name: e.group, items: [] }); g.items.push(e); });
  $("#nav").innerHTML = groups.length ? groups.map(g => `<div class="group-title"><span>${esc(g.name)}</span><span>${g.items.length}</span></div>` +
    g.items.map(e => `<button class="item" data-id="${e.id}" aria-current="${e.id === current}"><span class="m ${e.method}">${e.method === "REF" ? "DOC" : e.method}</span><span class="p">${e.method === "REF" ? "" : esc(e.path)}<span class="s">${esc(e.summary)}</span></span></button>`).join("")).join("")
    : '<div class="empty">ไม่พบ endpoint ที่ตรงกับคำค้น</div>';
}
function show(id, push = true) {
  const ep = ALL.find(e => e.id === id) || ALL[0];
  current = ep.id;
  copySeq = 0;
  $("#detail").innerHTML = (ep.method === "REF" ? renderRef(ep) : renderEndpoint(ep)) + pager(ep);
  renderNav();
  if (push) { try { history.replaceState(null, "", "#" + ep.id); } catch (e) {} }
  $("#main").scrollTop = 0;
  if (window.matchMedia("(max-width:860px)").matches && push) $("#main").scrollIntoView({ block: "start" });
}
function pager(ep) {
  const i = ALL.indexOf(ep), prev = ALL[i - 1], next = ALL[i + 1];
  const b = (e, dir) => e ? `<button data-id="${e.id}"><small>${dir}</small>${e.method === "REF" ? "" : e.method + " "}${esc(e.summary)}</button>` : "<span></span>";
  return `<div class="pager">${b(prev, "← ก่อนหน้า")}${b(next, "ถัดไป →")}</div>`;
}

document.addEventListener("click", (ev) => {
  const item = ev.target.closest("[data-id]");
  if (item) { show(item.dataset.id); return; }
  const chip = ev.target.closest(".chip");
  if (chip) { methodFilter = chip.dataset.m; document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === chip)); renderNav(); return; }
  const cp = ev.target.closest("[data-copy]");
  if (cp) {
    const pre = document.getElementById(cp.dataset.copy); const text = pre.textContent;
    const done = () => { cp.textContent = "คัดลอกแล้ว"; setTimeout(() => cp.textContent = "คัดลอก", 1400); };
    try { navigator.clipboard.writeText(text).then(done, () => selectText(pre)); } catch (e) { selectText(pre); }
  }
});
function selectText(el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
$("#q").addEventListener("input", renderNav);
["baseUrl", "apiKey"].forEach(id => {
  const el = document.getElementById(id); const saved = store.get("oms-" + id); if (saved) el.value = saved;
  el.addEventListener("change", () => { store.set("oms-" + id, el.value); show(current, false); });
});
$("#menuBtn").addEventListener("click", () => { const s = $("#side"); const c = s.classList.toggle("collapsed"); $("#menuBtn").setAttribute("aria-expanded", !c); $("#menuBtn").textContent = c ? "แสดงรายการ API" : "ซ่อนรายการ API"; });
window.addEventListener("hashchange", () => show(location.hash.slice(1), false));

show((location.hash || "").slice(1) || "ship-process", false);
</script>
