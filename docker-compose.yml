version: "3.8"
services:
  api_gateway:
    build:
      context: .
      dockerfile: ./BS-API-Secure/ApiGateway/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Bangkok
      - SERVERDB_SECURITY=Server=10.10.60.60;Database=Timesheet;user id=sa;password=Local@dmin;Encrypt=False;TrustServerCertificate=True;Integrated Security=False;
      - ISSUER_SIGIN_KEY=LqpOSpdD9FpngQnVzunOxe4hnxXdoN99bnYld4Pc16I=
      - VALID_ISSUER=http://10.10.60.188
      - VALID_AUDIENCE=http://10.10.60.188
      - ALLOWIP_WEB=*
      - KEY_WEB=API_KEY_WEB
    networks:
      - internal
    restart: always
  auth_api:
    build:
      context: .
      dockerfile: ./BS-API-Secure/Authentication/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    environment:
      - TZ=Asia/Bangkok
      - ASPNETCORE_ENVIRONMENT=Production
      - SERVERDB=Server=10.10.60.60;Database=Timesheet;user id=sa;password=Local@dmin;Encrypt=False;TrustServerCertificate=True;Integrated Security=False;
      - SERVERDB_SECURITY=Server=10.10.60.60;Database=Timesheet;user id=sa;password=Local@dmin;Encrypt=False;TrustServerCertificate=True;Integrated Security=False;
      - ISSUER_SIGIN_KEY=LqpOSpdD9FpngQnVzunOxe4hnxXdoN99bnYld4Pc16I=
      - VALID_ISSUER=http://10.10.60.188
      - VALID_AUDIENCE=http://10.10.60.188
      - EXPIRES=15
      - REFRESH=30
      - ACCESS_FAILURE_LIMIT=5
      - ALLOWIP_WEB=*
      - KEY_WEB=API_KEY_WEB
      - DB_SCHEMA=sec
      - USERNAME_ADMIN=Wau7MCRQswc=
    networks:
      - internal
    restart: always
  bs_core_api:
    build:
      context: .
      dockerfile: ./BS-API-Core/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    environment:
      - TZ=Asia/Bangkok
      - ASPNETCORE_ENVIRONMENT=Production
      - SERVERDB=Server=10.10.60.60;Database=Timesheet;user id=sa;password=Local@dmin;Encrypt=False;TrustServerCertificate=True;Integrated Security=False;
      - SERVERDB_SECURITY=Server=10.10.60.60;Database=Timesheet;user id=sa;password=Local@dmin;Encrypt=False;TrustServerCertificate=True;Integrated Security=False;
      - ISSUER_SIGIN_KEY=LqpOSpdD9FpngQnVzunOxe4hnxXdoN99bnYld4Pc16I=
      - VALID_ISSUER=http://10.10.60.188
      - VALID_AUDIENCE=http://10.10.60.188
      - EXPIRES=15
      - REFRESH=30
      - ACCESS_FAILURE_LIMIT=5
      - ALLOWIP_WEB=*
      - KEY_WEB=API_KEY_WEB
      - DB_SCHEMA=sec
      - USERNAME_ADMIN=Wau7MCRQswc=
    networks:
      - internal
    restart: always
  bs_import_export_manager:
    build:
      context: .
      dockerfile: ./BS-Import-Export-Manager/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    environment:
      - TZ=Asia/Bangkok
      - ASPNETCORE_ENVIRONMENT=Production
      - DATABASE_CONNECTION=Server=10.10.60.60;Database=Timesheet;User Id=sa;Password=Local@dmin;Encrypt=False;TrustServerCertificate=True;
      - SERVERDB=Server=10.10.60.60;Database=Timesheet;user id=sa;password=Local@dmin;Encrypt=False;TrustServerCertificate=True;Integrated Security=False;
      - SERVERDB_SECURITY=Server=10.10.60.60;Database=Timesheet;user id=sa;password=Local@dmin;Encrypt=False;TrustServerCertificate=True;Integrated Security=False;
      - ISSUER_SIGIN_KEY=LqpOSpdD9FpngQnVzunOxe4hnxXdoN99bnYld4Pc16I=
      - VALID_ISSUER=http://10.10.60.188
      - VALID_AUDIENCE=http://10.10.60.188
      - EXPIRES=15
      - REFRESH=30
      - ACCESS_FAILURE_LIMIT=5
      - ALLOWIP_WEB=*
      - KEY_WEB=API_KEY_WEB
      - DB_SCHEMA=sec
      - USERNAME_ADMIN=Wau7MCRQswc=
    networks:
      - internal
    restart: always
  bs_notification:
    build:
      context: .
      dockerfile: ./BS-Notification/Notification/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    ports:
        - "8081:8080"
    environment:
        - TZ=Asia/Bangkok
        - ASPNETCORE_ENVIRONMENT=Production
        - DATABASE_CONNECTION=Server=10.10.60.60;Database=Timesheet;User Id=sa;Password=Local@dmin;Encrypt=False;TrustServerCertificate=True;
        - SERVERDB=Server=10.10.60.60;Database=Timesheet;user id=sa;password=Local@dmin;Encrypt=False;TrustServerCertificate=True;Integrated Security=False;
        - SERVERDB_SECURITY=Server=10.10.60.60;Database=Timesheet;user id=sa;password=Local@dmin;Encrypt=False;TrustServerCertificate=True;Integrated Security=False;
        - ISSUER_SIGIN_KEY=LqpOSpdD9FpngQnVzunOxe4hnxXdoN99bnYld4Pc16I=
        - VALID_ISSUER=http://10.10.60.188
        - VALID_AUDIENCE=http://10.10.60.188
        - EXPIRES=15
        - REFRESH=30
        - ACCESS_FAILURE_LIMIT=5
        - ALLOWIP_WEB=*
        - KEY_WEB=API_KEY_WEB
        - DB_SCHEMA=sec
        - USERNAME_ADMIN=Wau7MCRQswc=
    networks:
      - internal
    restart: always
  bs_oms_api:
    build:
      context: .
      dockerfile: ./BS-OMS-API/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    ports:
      - "8082:8080"
    environment:
      - TZ=Asia/Bangkok
      - ASPNETCORE_ENVIRONMENT=Production
      - API_KEY_OMS=BS-OMS-API-Key-2025
      # Shopee
      - SHOPEE_PARTNER_ID=your_partner_id
      - SHOPEE_PARTNER_KEY=your_partner_key
      - SHOPEE_API_URL=https://partner.shopeemobile.com
      - SHOPEE_REDIRECT_URL=http://localhost:8082/api/auth/shopee/callback
      # Lazada
      - LAZADA_APP_KEY=your_app_key
      - LAZADA_APP_SECRET=your_app_secret
      - LAZADA_API_URL=https://api.lazada.co.th/rest
      - LAZADA_AUTH_URL=https://auth.lazada.com/oauth/authorize
      - LAZADA_REDIRECT_URL=http://localhost:8082/api/auth/lazada/callback
      # TikTok Shop
      - TIKTOK_APP_KEY=your_app_key
      - TIKTOK_APP_SECRET=your_app_secret
      - TIKTOK_API_URL=https://open-api.tiktokglobalshop.com
      - TIKTOK_AUTH_URL=https://services.tiktokshop.com/open/authorize
      - TIKTOK_REDIRECT_URL=http://localhost:8082/api/auth/tiktok/callback
    networks:
      - internal
    restart: always
networks:
  internal:
    driver: bridge
